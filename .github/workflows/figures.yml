name: Figure rebuild
on:
  workflow_dispatch:
jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m mechai_experiments.analyze --figures --tables --audit
